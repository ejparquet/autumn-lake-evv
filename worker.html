<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Lake EVV</title>
<meta name="description" content="Clock in, service logs and timesheets for Autumn Lake direct care workers.">
<meta name="theme-color" content="#EDEFF2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="brand_assets/icon-192.png">
<link rel="apple-touch-icon" href="brand_assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AL EVV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181F; --muted:#5D6470; --faint:#8A909A;
  --navy:#16243D; --navy-900:#0E1626; --navy-700:#2B3A55; --navy-100:#D6E8FB; --navy-50:#EDF5FE;
  --sky:#8CC8FF; --sky-300:#B5DBFF; --sky-100:#DCEEFF; --sky-50:#F0F7FF; --sky-600:#1F6FC5; --focus:#3A93E8;
  --paper:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F6F8; --line:#E4E7EB; --line-2:#EEF0F3;
  --ok:#2C6A4D; --ok-50:#E2F0E7; --warn:#875700; --warn-50:#FDF0CF; --bad:#A3311D; --bad-50:#FBE3DC;
  --sh-1:0 1px 2px rgba(16,24,40,.04);
  --sh-2:0 1px 2px rgba(16,24,40,.04),0 10px 24px -14px rgba(16,24,40,.14);
  --sh-3:0 4px 10px rgba(16,24,40,.06),0 28px 56px -18px rgba(16,24,40,.26);
  --spring:cubic-bezier(.34,1.36,.64,1); --ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Geist',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 70% -10%,rgba(140,200,255,.25),transparent 60%),var(--paper)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:-.02em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.phone{max-width:440px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(600px 360px at 90% -10%,rgba(140,200,255,.28),transparent 60%),var(--paper)}
@media (min-width:520px){ .phone{height:min(900px,calc(100dvh - 32px));margin-top:16px;border-radius:28px;border:1px solid var(--line);box-shadow:var(--sh-3)} }
.scroll{flex:1;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px;position:relative}

/* Header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:500}
.brand .logo{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line-2);display:grid;place-items:center}
.brand b{display:block;color:var(--ink);font-weight:600;font-size:14px;line-height:1.2}
.hero-h{font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.05em;margin:20px 0 4px}
.hero-h span{color:#A3A9B2}
.page-h{font-weight:400;font-size:34px;letter-spacing:-.045em;margin:12px 0 4px;line-height:1.1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sub{color:var(--muted);margin:0;font-size:14.5px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 4px}
.card-h h2{margin:0;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.ic-tile{width:26px;height:26px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);display:inline-grid;place-items:center;flex:none}
.ic-tile svg{width:14px;height:14px}
.stack{display:grid;gap:8px}
.stack>*{min-width:0} [hidden]{display:none!important}
.mt{margin-top:8px} .mt2{margin-top:16px} .mt3{margin-top:24px}
.glass{position:relative;border-radius:16px;padding:16px;background:linear-gradient(140deg,rgba(140,200,255,.9),rgba(196,226,255,.92) 45%,rgba(246,251,255,.97));border:1px solid #fff;box-shadow:0 24px 44px -22px rgba(31,111,197,.5),inset 0 1px 0 #fff}
.glass-wrap{position:relative;padding:14px 14px 0 0}
.glass-wrap::before,.glass-wrap::after{content:"";position:absolute;border-radius:16px;border:1px solid rgba(255,255,255,.8);background:linear-gradient(135deg,rgba(140,200,255,.3),rgba(230,243,255,.5))}
.glass-wrap::before{top:0;right:0;left:28px;bottom:28px;opacity:.55}
.glass-wrap::after{top:7px;right:7px;left:14px;bottom:14px;opacity:.8}
.glass-wrap .glass{z-index:1}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;font:inherit;font-weight:500;font-size:17px;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;color:inherit;transition:transform .35s var(--spring),background-color .2s,box-shadow .2s}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn-primary{background:var(--navy-900);color:#fff;box-shadow:0 8px 18px -10px rgba(14,22,38,.7)}
.btn-primary:hover{background:var(--navy-700)}
.btn-sky{background:var(--sky);color:var(--ink);box-shadow:0 8px 18px -10px rgba(31,111,197,.7)}
.btn-sky:hover{background:var(--sky-300)}
.btn-danger{background:#C83A1E;color:#fff;box-shadow:0 8px 18px -10px rgba(163,49,29,.8)}
.btn-danger:hover{background:#B4331A}
.btn-ghost{background:var(--surface);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-glass{background:rgba(255,255,255,.65);border-color:#fff}
.btn-glass:hover{background:#fff}
.btn-sm{min-height:44px;font-size:15px;width:auto;padding:0 16px}
.btn-xl{min-height:62px;font-size:18px}
.link{color:var(--sky-600);font-weight:500;background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(31,111,197,.3);text-underline-offset:3px}
.link:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

/* Chips, meters */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:999px;line-height:1.6;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-50);color:var(--ok)} .chip.warn{background:var(--warn-50);color:var(--warn)} .chip.bad{background:var(--bad-50);color:var(--bad)} .chip.info{background:var(--navy-50);color:var(--sky-600)} .chip.neutral{background:#ECEEF1;color:#4B5263}
.hbar{height:12px;border-radius:5px;overflow:hidden;background:repeating-linear-gradient(-55deg,#DDE1E6 0 1.5px,transparent 1.5px 5px)}
.hbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--navy-900) 0 10px,var(--sky) 10px);transform-origin:left;animation:grow .9s var(--ease) both}
.hbar.warn i{background:linear-gradient(90deg,var(--navy-900) 0 10px,#F2B544 10px)} .hbar.bad i{background:linear-gradient(90deg,var(--navy-900) 0 10px,#E8603D 10px)}
@keyframes grow{from{transform:scaleX(0)}}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;background:var(--sky-100);color:var(--navy);flex:none}
.av.ink{background:var(--navy-900);color:var(--sky-100)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner.warn{background:var(--warn-50);color:#5E3D00} .banner.bad{background:var(--bad-50);color:#6E1E10} .banner.ok{background:var(--ok-50);color:#1D4A35} .banner.info{background:var(--sky-50);color:#1D3F66;border:1px solid var(--navy-100)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;font-size:15px} .kv dt{color:var(--muted)} .kv dd{margin:0}
.timer{font-weight:300;font-size:64px;line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums}

/* List rows */
.list-btn{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:14px 16px;font:inherit;background:transparent;border:0;border-top:1px solid var(--line-2);cursor:pointer;min-height:64px;color:inherit;transition:background-color .15s}
.list-btn:first-child{border-top:0}
.list-btn:hover{background:#F8FAFC} .list-btn:active{background:#F1F4F7} .list-btn:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.static{cursor:default} .static:hover{background:transparent}

/* Tabs */
.tabs{position:relative;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 12px calc(12px + env(safe-area-inset-bottom));padding:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--sh-2)}
.tabs button{font:inherit;font-size:11.5px;font-weight:500;color:var(--muted);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:54px;border-radius:13px;cursor:pointer;position:relative;transition:color .2s,background-color .2s}
.tabs button svg{width:22px;height:22px;transition:transform .35s var(--spring)}
.tabs button:hover{color:var(--ink)} .tabs button:active svg{transform:scale(.88)}
.tabs button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.tabs button[aria-current=page]{background:var(--navy-900);color:#fff}
.tabs .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#E8603D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}

/* Sheets */
.sheet-scrim{position:absolute;inset:0;z-index:20;background:rgba(14,22,38,.35);backdrop-filter:blur(2px);animation:fade .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;box-shadow:var(--sh-3);animation:up .5s var(--spring);padding-bottom:env(safe-area-inset-bottom)}
.grab{width:40px;height:5px;border-radius:3px;background:#D9DDE2;margin:8px auto 0}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 16px 8px}
.sheet-h h2{margin:2px 0 0;font-weight:500;font-size:24px;letter-spacing:-.035em;line-height:1.15}
.sheet-b{padding:4px 16px 24px;overflow-y:auto}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink);transition:transform .3s var(--spring)}
.x:hover{background:var(--surface-2)} .x:active{transform:scale(.92)} .x:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.x svg{width:20px;height:20px}
@keyframes up{from{transform:translateY(100%)}} @keyframes fade{from{opacity:0}}

/* Forms */
label.f,.f{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-bottom:6px}
.in{width:100%;font:inherit;font-size:16px;padding:12px 14px;min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.in:focus{outline:none;border-color:var(--sky-600);box-shadow:0 0 0 3px rgba(58,147,232,.2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:500;transition:background-color .2s,border-color .2s,transform .3s var(--spring)}
.task:hover{border-color:#CFD5DC} .task:active{transform:scale(.98)}
.task input{width:22px;height:22px;accent-color:var(--navy-900);flex:none}
.task:has(input:checked){background:var(--sky-50);border-color:var(--navy-100)}
.task:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px;min-height:80px;border-radius:14px;border:1px solid var(--line);background:#fff;font:inherit;text-align:left;cursor:pointer;color:inherit;transition:transform .35s var(--spring),box-shadow .2s,border-color .2s}
.choice:hover{border-color:#CFD5DC;box-shadow:var(--sh-2)} .choice:active{transform:scale(.98)} .choice:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.choice .ci{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;flex:none}
.choice .ci svg{width:26px;height:26px}
.choice b{font-weight:500;font-size:17px} .choice small{color:var(--muted);font-size:14px}
.steps{display:flex;gap:6px;margin:4px 0 16px} .steps i{flex:1;height:4px;border-radius:2px;background:var(--line)} .steps i.on{background:var(--navy-900)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;cursor:pointer;font-weight:500}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .tr{width:50px;height:30px;border-radius:999px;background:#D5DAE0;position:relative;transition:background-color .25s;flex:none}
.toggle .tr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.toggle input:checked + .tr{background:var(--navy-900)} .toggle input:checked + .tr::after{transform:translateX(20px)}
.toggle input:focus-visible + .tr{outline:3px solid var(--focus);outline-offset:2px}
.toggle input:disabled + .tr{opacity:.6}

/* Camera / GPS */
.viewfinder{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 40% 30%,#2B3A55,#0E1626);display:grid;place-items:center}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder .corners{position:absolute;inset:18%;border-radius:12px;background:
  linear-gradient(var(--sky),var(--sky)) top left/34px 4px no-repeat,linear-gradient(var(--sky),var(--sky)) top left/4px 34px no-repeat,
  linear-gradient(var(--sky),var(--sky)) top right/34px 4px no-repeat,linear-gradient(var(--sky),var(--sky)) top right/4px 34px no-repeat,
  linear-gradient(var(--sky),var(--sky)) bottom left/34px 4px no-repeat,linear-gradient(var(--sky),var(--sky)) bottom left/4px 34px no-repeat,
  linear-gradient(var(--sky),var(--sky)) bottom right/34px 4px no-repeat,linear-gradient(var(--sky),var(--sky)) bottom right/4px 34px no-repeat}
.viewfinder .line{position:absolute;left:20%;right:20%;top:20%;height:2px;background:var(--sky);box-shadow:0 0 16px 4px rgba(140,200,255,.6);animation:scan 1.6s ease-in-out infinite alternate}
.vf-msg{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:#fff;font-size:14px;background:rgba(14,22,38,.55);backdrop-filter:blur(6px);border-radius:10px;padding:8px 10px}
@keyframes scan{to{transform:translateY(calc(min(60vw,250px)))}}
.radar{position:relative;width:170px;height:170px;margin:16px auto;display:grid;place-items:center}
.radar span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sky-600);opacity:0;animation:ping 2s var(--ease) infinite}
.radar span:nth-child(2){animation-delay:.6s} .radar span:nth-child(3){animation-delay:1.2s}
.radar b{width:56px;height:56px;border-radius:50%;background:var(--navy-900);display:grid;place-items:center;color:#fff}
@keyframes ping{0%{opacity:.6;transform:scale(.3)}100%{opacity:0;transform:scale(1)}}

/* Signature */
.pad-wrap{position:relative;border:1.5px dashed #CFD5DC;border-radius:14px;background:#fff;touch-action:none}
.pad-wrap canvas{display:block;width:100%;height:200px;border-radius:14px;cursor:crosshair}
.pad-wrap .base{position:absolute;left:20px;right:20px;bottom:44px;border-bottom:1px solid var(--line);pointer-events:none}
.pad-wrap .hint{position:absolute;left:20px;bottom:16px;font-size:13px;color:var(--faint);pointer-events:none}

/* Messages */
.bubble{max-width:82%;padding:12px 14px;border-radius:16px 16px 4px 16px;background:var(--navy-900);color:#fff;margin-left:auto}
.bubble.them{background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:16px 16px 16px 4px;margin-left:0}

/* Call / overlays */
.call{position:absolute;inset:0;z-index:40;background:radial-gradient(500px 400px at 50% 20%,rgba(140,200,255,.35),transparent 60%),var(--navy-900);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:72px 24px 48px;animation:fade .3s}
.call .ring{width:108px;height:108px;border-radius:28px;background:#fff;display:grid;place-items:center;position:relative}
.call .ring::before,.call .ring::after{content:"";position:absolute;inset:-12px;border-radius:36px;border:2px solid rgba(140,200,255,.6);animation:ping 1.8s infinite}
.call .ring::after{animation-delay:.9s}
.round{width:72px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;transition:transform .35s var(--spring)}
.round:active{transform:scale(.92)} .round:hover{filter:brightness(1.08)} .round:focus-visible{outline:3px solid var(--sky);outline-offset:4px}
.round svg{width:30px;height:30px;color:#fff}
.toast{position:absolute;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:50;background:var(--navy-900);color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-3);font-weight:500;font-size:15px;animation:drop .5s var(--spring)}
.toast svg{width:20px;color:var(--sky);flex:none}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}}
.offline{display:none;position:absolute;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:30;background:var(--warn-50);color:var(--warn);font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid #F1D89A}
body.is-offline .offline{display:block}
.reveal{animation:rise .55s var(--ease) both} .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* Calendar */
.seg{display:flex;background:#E4E7EB;border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;padding:8px 6px;border-radius:9px;cursor:pointer;color:var(--muted);min-height:40px;transition:background-color .2s,color .2s}
.seg button:hover{color:var(--ink)} .seg button:active{transform:scale(.97)} .seg button:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)} .legend span{display:inline-flex;align-items:center;gap:6px}
.legend i,.dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dt-visit{background:var(--navy-900)} .dt-training{background:#3A93E8} .dt-event{background:#F0A04B} .dt-closed{background:#A3A9B2} .dt-off{background:#3FA172}
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wday{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:inherit;min-height:66px;transition:transform .3s var(--spring),background-color .2s}
.wday small{font-size:11px;color:var(--faint);font-weight:600} .wday b{font-size:18px;font-weight:500;letter-spacing:-.03em}
.wday:active{transform:scale(.95)} .wday:focus-visible,.mday:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.wday.today b{color:var(--sky-600)} .wday.offday{background:#E6F4EC;border-color:#C5E3D2}
.wday.sel{background:var(--navy-900);border-color:var(--navy-900);color:#fff} .wday.sel small{color:#B9C5DC} .wday.sel.today b{color:var(--sky)}
.dots{display:flex;gap:3px;height:8px;align-items:center} .dots i{width:6px;height:6px}
.wday.sel .dt-visit{background:#fff}
.dayblock{scroll-margin-top:12px} .day-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px;font-size:15px}
.day-h b{font-weight:500} .is-today .day-h b{color:var(--sky-600)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div class="phone" id="phone">
  <div class="offline" role="status">Offline — changes will sync when you reconnect</div>
  <main class="scroll" id="screen" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <div id="layer"></div>
</div>

<script>
const I = {
  home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  sheet:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-4M14 21v-3"/>',
  gps:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>',
  pin:'<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  check:'<path d="m5 12 5 5 9-10"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  send:'<path d="m4 12 16-8-6 16-2-7z"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>', back:'<path d="M15 5l-7 7 7 7"/>',
  out:'<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4"/>', pen:'<path d="M3 21c3-1 5-3 6-6l9-9a2.1 2.1 0 0 0-3-3l-9 9c-3 1-5 3-6 6"/>',
  chev:'<path d="m9 5 7 7-7 7"/>', shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  install:'<path d="M12 3v12m-5-5 5 5 5-5"/><rect x="4" y="17" width="16" height="4" rx="1"/>', share:'<path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v8h14v-8"/>', gauge:'<path d="M4 15a8 8 0 1 1 16 0"/><path d="m12 15 4-5"/>'
};
const ic = (n, s='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${s}>${I[n]}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = m => new Date(Date.now() - m*60000), ahead = m => new Date(Date.now() + m*60000);
const dayAt = (d,h,m=0) => { const x = new Date(); x.setDate(x.getDate()+d); x.setHours(h,m,0,0); return x; };
const fmtT = d => d ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '—';
const fmtDay = d => d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const hrs = (a,b) => (b-a)/3600000;
const ini = n => n.split(' ').map(x=>x[0]).join('').slice(0,2);
const distM = (a,b,c,d) => { const R = 6371e3, t = x => x*Math.PI/180, h = Math.sin(t(c-a)/2)**2 + Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const fmtDist = m => m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(m < 10000 ? 1 : 0)} km`;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ===== State (sample data) ===== */
const me = {name:'Tasha Robichaux', first:'Tasha', lasrs:'W-204118', sup:'Monique Thibodeaux', capW:40};
const clients = {
  c1:{name:'Odette Guidry', addr:'4127 Government St, Baton Rouge', svc:'LT-PCS', radius:150, lat:30.4446, lng:-91.1530, lasrs:'LR-30018842'},
  c3:{name:'Lorraine Hebert', addr:'9533 Florida Blvd, Baton Rouge', svc:'NOW-IFS', radius:200, lat:30.4581, lng:-91.0650, lasrs:'LR-30019310'},
};
const TASKS = ['Bathing / personal hygiene','Dressing & grooming','Meal preparation','Medication reminder','Mobility / transfers','Light housekeeping','Laundry','Errands / shopping','Companionship'];
const today = [
  {id:'V-88180', c:'c3', start:dayAt(0,7,0), end:dayAt(0,10,0), aIn:dayAt(0,7,2), aOut:dayAt(0,10,1), method:'QR', status:'done'},
  {id:'V-88211', c:'c1', start:ago(5), end:ahead(85), status:'next'},
];
const week = [
  {d:-6, c:'c1', in:[9,0], out:[13,15]}, {d:-5, c:'c3', in:[8,0], out:[14,30]}, {d:-5, c:'c1', in:[15,0], out:[18,0]},
  {d:-4, c:'c1', in:[8,0], out:[12,0]}, {d:-3, c:'c3', in:[8,0], out:[14,30], corr:'Approved'},
  {d:-2, c:'c1', in:[9,0], out:[13,15]}, {d:-1, c:'c3', in:[7,0], out:[13,0]},
].map((x,i)=>({id:'V-8'+(8000+i*17), c:x.c, aIn:dayAt(x.d,...x.in), aOut:dayAt(x.d,...x.out), corr:x.corr}));
let active = null; // {visit, start, method, dist, flagged, coords}
let tsStatus = 'Draft';
const msgs = [
  {id:'t1', from:'Monique Thibodeaux', role:'Supervisor', unread:true, items:[{me:false, t:ago(40), body:'Reminder: storm advisory for East Baton Rouge tonight. Please confirm your evening visits with clients before heading out.'}]},
  {id:'t2', from:'Autumn Lake Office', role:'Agency', unread:false, items:[{me:false, t:ago(1440), body:'Weekend timesheets are due Sunday by 8 PM. Please make sure clients sign on the last visit of the week.'},{me:true, t:ago(1400), body:'Got it, thank you!'}]},
];
let tab = 'today', openThread = null;
const weekHours = () => week.reduce((s,v)=>s+hrs(v.aIn,v.aOut),0) + today.filter(v=>v.status==='done').reduce((s,v)=>s+hrs(v.aIn,v.aOut),0) + (active ? hrs(active.start, new Date()) : 0);

/* ===== UI utils ===== */
function toast(msg, icon='check'){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.innerHTML = ic(icon)+`<span>${esc(msg)}</span>`; $('#phone').appendChild(t); setTimeout(()=>t.remove(), 3000); }
function sheet(title, body, {eyebrow=''}={}){
  stopCam();
  $('#layer').innerHTML = `<div class="sheet-scrim" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab" aria-hidden="true"></div>
  <div class="sheet-h"><div>${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h2 id="sh-t">${title}</h2></div><button class="x" data-close aria-label="Close">${ic('x')}</button></div>
  <div class="sheet-b" id="sheet-b">${body}</div></section>`;
  setTimeout(()=>($('#sheet-b button, #sheet-b input, #sheet-b textarea') || $('.x'))?.focus(), 60);
}
const closeSheet = () => { stopCam(); $('#layer').innerHTML=''; };
const hbar = (u,c) => { const p = u/c*100; return `<div class="hbar ${p>100?'bad':p>=90?'warn':''}" role="meter" aria-valuemin="0" aria-valuemax="${c}" aria-valuenow="${u.toFixed(1)}" aria-label="${u.toFixed(1)} of ${c} hours"><i style="width:${Math.max(6,Math.min(p,100))}%"></i></div>`; };
const elapsed = d => { const s = Math.max(0, Math.floor((Date.now()-d)/1000)); return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}<span style="font-size:.45em;color:var(--muted);letter-spacing:-.02em">:${String(s%60).padStart(2,'0')}</span>`; };
const topbar = () => `<div class="topbar"><div class="brand"><span class="logo"><img src="brand_assets/logo.png" alt="" width="30"></span><div><b>Autumn Lake</b>${new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div></div><button class="av ink" data-tab="profile" aria-label="Profile" style="border:0;cursor:pointer">${ini(me.name)}</button></div>`;

/* ===== Screens ===== */
const screens = {};
screens.today = () => {
  const h = new Date().getHours(), greet = h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const wh = weekHours(), pct = wh/me.capW*100, next = today.find(v=>v.status==='next');
  const overdue = active && Date.now() > active.visit.end.getTime();
  let main;
  if (active){
    const c = clients[active.visit.c];
    main = `<div class="glass-wrap reveal"><section class="glass" aria-live="polite">
      <div class="row between"><span class="row" style="gap:8px;font-size:14px;font-weight:500"><span class="ic-tile" style="background:rgba(255,255,255,.6);border-color:#fff">${ic('clock')}</span>On visit</span><span class="chip ${overdue?'bad':'ok'}">${overdue?'Past scheduled end':active.method==='QR'?'Verified by QR':'Verified by GPS'}</span></div>
      <div class="timer mt2" id="timer">${elapsed(active.start)}</div>
      <p class="sub" style="color:#3E5776;margin-top:8px">Since ${fmtT(active.start)} · scheduled until <b style="color:var(--ink);font-weight:600">${fmtT(active.visit.end)}</b></p>
      <div class="row mt2" style="background:rgba(255,255,255,.6);border:1px solid #fff;border-radius:12px;padding:10px"><div class="av">${ini(c.name)}</div><div style="line-height:1.35"><b style="font-weight:600">${esc(c.name)}</b><br><small style="color:#3E5776">${c.svc}${active.dist!=null?` · ${fmtDist(active.dist)} from home`:''}${active.flagged?' · flagged for review':''}</small></div></div>
      ${overdue?`<div class="banner bad mt2">${ic('phone')}<div><b>Please clock out.</b> You'll get an automated call if you stay clocked in, then your supervisor is notified.</div></div>`:''}
      <button class="btn btn-danger btn-xl mt2" data-act="clockout">${ic('out')}Clock out</button>
    </section></div>`;
  } else if (next){
    const c = clients[next.c], after = wh + hrs(next.start,next.end);
    main = `<section class="card reveal" style="padding:16px">
      <div class="row between"><span class="row" style="gap:8px;font-size:14px;font-weight:500"><span class="ic-tile">${ic('pin')}</span>Next visit</span><span class="chip info">${fmtT(next.start)}</span></div>
      <div class="row mt2"><div class="av" style="width:52px;height:52px;font-size:17px">${ini(c.name)}</div><div style="line-height:1.25"><div style="font-size:24px;font-weight:400;letter-spacing:-.035em">${esc(c.name)}</div><small style="color:var(--muted);font-size:14px">${c.svc} · ${hrs(next.start,next.end).toFixed(1)} h</small></div></div>
      <dl class="kv mt2" style="font-size:14.5px"><dt>Time</dt><dd>${fmtT(next.start)} – ${fmtT(next.end)}</dd><dt>Address</dt><dd><a class="link" href="https://maps.apple.com/?q=${encodeURIComponent(c.addr)}" target="_blank" rel="noopener">${esc(c.addr)}</a></dd></dl>
      ${after/me.capW >= .9 ? `<div class="banner warn mt2">${ic('gauge')}<div>This visit brings you to <b>${after.toFixed(1)} of ${me.capW} hours</b> this week. Please don't stay past your scheduled end.</div></div>`:''}
      <button class="btn btn-primary btn-xl mt2" data-act="clockin">${ic('qr')}Clock in</button>
    </section>`;
  } else {
    main = `<section class="card reveal" style="padding:24px;text-align:center"><div style="font-size:22px;letter-spacing:-.03em">You're done for today</div><p class="sub mt">No more visits scheduled. Rest up, ${me.first}.</p></section>`;
  }
  const unread = msgs.filter(m=>m.unread).length;
  const showInstall = !isStandalone() && !localStorageGet('al-install-dismissed');
  return `${topbar()}
  <h1 class="hero-h reveal"><span>${greet},</span><br>${me.first}</h1>
  <p class="sub reveal">${today.filter(v=>v.status!=='done').length ? `${today.filter(v=>v.status!=='done').length} visit${today.filter(v=>v.status!=='done').length>1?'s':''} left today` : 'All visits complete'}</p>
  <div class="stack mt2">
    ${main}
    ${showInstall ? `<section class="card reveal d1" style="padding:14px 16px"><div class="row"><span class="ic-tile" style="width:40px;height:40px;border-radius:10px">${ic('install','style="width:20px;height:20px"')}</span><div style="flex:1;line-height:1.35"><b style="font-weight:500">Add to your home screen</b><br><small style="color:var(--muted)">Open it like an app — no app store needed.</small></div></div>
      <div class="row mt"><button class="btn btn-sky btn-sm" style="flex:1" data-act="install">Install</button><button class="btn btn-ghost btn-sm" data-act="install-dismiss">Not now</button></div></section>` : ''}
    ${unread?`<button class="card list-btn reveal d1" style="border-radius:14px" data-tab="messages"><span class="ic-tile" style="width:40px;height:40px;border-radius:10px">${ic('chat','style="width:20px;height:20px"')}</span><span style="flex:1;line-height:1.35"><b style="font-weight:500">${unread} new message${unread>1?'s':''}</b><br><small style="color:var(--muted)">From ${esc(msgs.find(m=>m.unread).from)}</small></span>${ic('chev','style="width:18px;color:var(--faint)"')}</button>`:''}
    <section class="card reveal d2" style="padding:14px 16px">
      <div class="row between"><span class="row" style="gap:8px;font-size:14px;font-weight:500"><span class="ic-tile">${ic('gauge')}</span>This week</span><span class="mono" style="font-size:14px">${wh.toFixed(1)} / ${me.capW} h</span></div>
      <div style="font-weight:300;font-size:44px;letter-spacing:-.055em;line-height:1;margin:14px 0 10px">${wh.toFixed(1)}<span style="font-size:.4em;color:var(--muted);letter-spacing:0"> hrs</span></div>
      ${hbar(wh, me.capW)}
      <small style="display:block;margin-top:8px;color:${pct>=90?'var(--warn)':'var(--muted)'};font-weight:${pct>=90?600:400}">${pct>100?'Over your weekly cap — your supervisor has been alerted.':pct>=90?`Approaching your weekly cap · ${(me.capW-wh).toFixed(1)} h left`:`${(me.capW-wh).toFixed(1)} h left this week`}</small>
    </section>
    ${(() => { const up = []; for (let i = 0; i < 60 && up.length < 3; i++){ const ds = iso(addDays(new Date(), i)); itemsOn(ds).filter(x => x.kind !== 'visit' && x.kind !== 'closed').forEach(x => up.length < 3 && up.push({...x, ds})); }
      return up.length ? `<section class="card reveal d3" style="overflow:hidden"><div class="card-h"><h2><span class="ic-tile">${ic('cal')}</span>Coming up</h2><button class="link" style="font-size:14px" data-tab="calendar">Calendar</button></div><div class="stack" style="padding:8px 12px 12px">${up.map(x => `<div><small style="color:var(--muted);font-size:12.5px;margin-left:2px">${shortDay(x.ds)}</small>${calItem(x)}</div>`).join('')}</div></section>` : ''; })()}
    <section class="card reveal d3" style="overflow:hidden"><div class="card-h"><h2><span class="ic-tile">${ic('clock')}</span>Today</h2></div>
      ${today.map(v=>{ const c = clients[v.c], isA = active && active.visit.id===v.id;
        return `<div class="list-btn static"><div class="av" style="${v.status==='done'?'background:var(--ok-50);color:var(--ok)':''}">${v.status==='done'?ic('check','style="width:20px"'):ini(c.name)}</div>
        <div style="flex:1;line-height:1.35"><b style="font-weight:500">${esc(c.name)}</b><br><small style="color:var(--muted)">${v.status==='done'?`${fmtT(v.aIn)} – ${fmtT(v.aOut)} · log submitted`:`${fmtT(v.start)} – ${fmtT(v.end)}`}</small></div>
        ${v.status==='done'?'<span class="chip ok">Done</span>':isA?'<span class="chip info">In progress</span>':'<span class="chip neutral">Upcoming</span>'}</div>`; }).join('')}
    </section>
  </div>`;
};


/* ===== Calendar data (mirrors the agency calendar on the dashboard) ===== */
const iso = d => d.toLocaleDateString('en-CA');
const pdate = s => new Date(s+'T12:00:00');
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => { const x = new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; };
const atTime = (ds, hhmm) => { const [h,m] = hhmm.split(':').map(Number); const d = pdate(ds); d.setHours(h,m,0,0); return d; };
const t12 = hhmm => { if (!hhmm) return ''; const [h,m] = hhmm.split(':').map(Number); return `${(h%12)||12}${m?':'+String(m).padStart(2,'0'):''} ${h<12?'AM':'PM'}`; };
const nthDow = (y,m,dow,n) => { const d = new Date(y,m,1,12); d.setDate(1 + ((dow-d.getDay()+7)%7) + (n-1)*7); return d; };
const lastDow = (y,m,dow) => { const d = new Date(y,m+1,0,12); d.setDate(d.getDate() - ((d.getDay()-dow+7)%7)); return d; };
const longDay = ds => pdate(ds).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const shortDay = ds => pdate(ds).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

let stream = null, raf = 0;
const vfMsg = t => { const m = $('#vf-msg'); if (m) m.textContent = t; };
function stopCam(){ cancelAnimationFrame(raf); if (stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } }
const loadJsQR = () => window.jsQR ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
async function scanFlow(){
  sheet('Scan the QR code', `<div class="viewfinder" aria-label="Camera viewfinder"><video id="cam" playsinline muted></video><div class="corners"></div><div class="line"></div><span class="vf-msg" id="vf-msg">Starting camera…</span></div>
    <p style="font-size:14px;color:var(--muted);margin:12px 4px 0">Point your camera at the Autumn Lake code posted in the client's home.</p>
    <button class="btn btn-ghost btn-sm mt2" style="width:100%" data-act="demo-scan">Use demo scan (no code nearby)</button>`, {eyebrow:'Clock in · QR'});
  if (!navigator.mediaDevices?.getUserMedia){ vfMsg('Camera not available here — use demo scan.'); return; }
  try {
    await loadJsQR();
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = $('#cam'); if (!v){ s.getTracks().forEach(t=>t.stop()); return; }
    stream = s; v.srcObject = s; await v.play(); vfMsg('Looking for a code…'); tick();
  } catch(e){ vfMsg(e && e.name === 'NotAllowedError' ? 'Camera permission denied — allow it in your browser settings, or use demo scan.' : 'Camera unavailable — use demo scan.'); }
}
const cvs = document.createElement('canvas'), cctx = cvs.getContext('2d', {willReadFrequently:true});
function tick(){
  const v = $('#cam'); if (!v || !stream){ stopCam(); return; }
  if (v.readyState >= 2 && v.videoWidth){
    const sc = Math.min(1, 640 / v.videoWidth); cvs.width = v.videoWidth*sc; cvs.height = v.videoHeight*sc;
    cctx.drawImage(v, 0, 0, cvs.width, cvs.height);
    const img = cctx.getImageData(0, 0, cvs.width, cvs.height), code = jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'});
    if (code){
      const m = code.data.match(/autumnlake:\/\/evv\/client\/([\w-]+)/), cid = m && Object.keys(clients).find(k => clients[k].lasrs === m[1]), next = today.find(x=>x.status==='next');
      if (cid && next && cid === next.c){ stopCam(); navigator.vibrate?.(60); return verified('QR', null, null, false); }
      vfMsg(!m ? 'That isn’t an Autumn Lake client code' : cid ? `That code is for ${clients[cid].name} — your next visit is ${clients[next.c].name}` : 'This client isn’t on your schedule today');
    }
  }
  raf = requestAnimationFrame(tick);
}
function gpsFlow(){
  sheet('Finding your location', `<div class="radar" aria-hidden="true"><span></span><span></span><span></span><b>${ic('gps','style="width:24px"')}</b></div><p id="gps-msg" style="text-align:center;color:var(--muted);margin:0">Hold still for a moment…</p>

  if (!navigator.geolocation){ $('#gps-msg').textContent = 'Location isn’t available on this device.'; return; }

}

const padHtml = label => `<div class="pad-wrap"><canvas id="pad" role="img" aria-label="${label} pad. Draw with your finger."></canvas><div class="base"></div><div class="hint">✕ ${label}</div></div><div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="pad-clear">Clear</button></div>`;
let padDirty = false;
function initPad(){
  const cv = $('#pad'), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width*dpr; cv.height = r.height*dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0E1626';
  padDirty = false; let drawing = false, last;
  const pt = e => { const b = cv.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; };
  cv.onpointerdown = e => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); };

}

/* ===== Install (PWA) ===== */
let deferredPrompt = null;
const localStorageGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const localStorageSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('Installed — open it from your home screen'); render(); });
async function installApp(){
  if (deferredPrompt){ deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; deferredPrompt = null; if (r.outcome === 'accepted') toast('Installing…'); return; }
  sheet('Add to your home screen', isIOS
    ? `<ol class="stack" style="padding-left:20px;margin:0;font-size:16px"><li>Tap the <b>Share</b> button ${ic('share','style="width:18px;display:inline;vertical-align:-3px"')} in Safari's toolbar.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. Autumn Lake EVV opens full-screen from your home screen.</li></ol><p style="font-size:13.5px;color:var(--muted);margin:16px 0 0">Must be opened in Safari to install on iPhone or iPad.</p>`
    : `<ol class="stack" style="padding-left:20px;margin:0;font-size:16px"><li>Open your browser's menu <b>⋮</b>.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Confirm. Autumn Lake EVV opens full-screen like any other app.</li></ol>`, {eyebrow:'Install'});
}

/* ===== Render ===== */
function render(){
  $('#screen').innerHTML = screens[tab]();
  const unread = msgs.filter(m=>m.unread).length;
  const T = [['today','Today','home'],['calendar','Calendar','cal'],['timesheet','Timesheet','sheet'],['messages','Messages','chat'],['profile','Profile','user']];
  $('#tabs').innerHTML = T.map(([k,l,i])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${ic(i)}${l}${k==='messages'&&unread?`<span class="dot" aria-label="${unread} unread">${unread}</span>`:''}</button>`).join('');
}
setInterval(()=>{ const t = $('#timer'); if (t && active) t.innerHTML = elapsed(active.start); }, 1000);

const acts = {
  clockin: clockInFlow, scan: scanFlow, gps: gpsFlow,
  'demo-scan': () => verified('QR', null, null, false),
  'demo-gps': () => verified('GPS', 34, null, false),
  'flag-in': el => verified('GPS', +el.dataset.d, {la:+el.dataset.la, lo:+el.dataset.lo}, true),
  'confirm-in': el => { const v = today.find(x=>x.status==='next'); active = {visit:v, start:new Date(), method:el.dataset.m, dist: el.dataset.d === '' ? null : +el.dataset.d, flagged:!!el.dataset.f}; v.status='active'; closeSheet(); toast(`Clocked in with ${clients[v.c].name}`); render(); },
  clockout: () => clockOutFlow(1),
  'log-next': () => { const tasks = [...document.querySelectorAll('[name=task]:checked')].map(x=>x.value); if (!tasks.length){ toast('Select at least one task', 'alert'); return; } clockOutFlow(2, {tasks, notes:$('#notes').value}); },
  'pad-clear': () => initPad(),
  'finish-out': () => { if (!padDirty){ toast('Client signature needed', 'alert'); return; } endVisit(); },
  'no-sig': () => endVisit(true),
  correct: el => correctionFlow(el.dataset.id),
  'submit-corr': el => { const r = $('#cr').value.trim(); if (!r){ $('#cr').setAttribute('aria-invalid','true'); $('#cr-err').style.display='block'; $('#cr').focus(); return; } [...week, ...today].find(x=>x.id===el.dataset.id).corr = 'Pending'; closeSheet(); toast('Correction sent to '+me.sup.split(' ')[0]); render(); },
  'sign-worker': () => signTs('worker'), 'sign-client': () => signTs('client'),
  'ts-sign': el => { if (!padDirty){ toast('Please sign in the box', 'alert'); return; } tsStatus = el.dataset.who === 'worker' ? 'Submitted' : 'Client Signed'; closeSheet(); toast(el.dataset.who === 'worker' ? 'Timesheet signed & submitted' : 'Client signed · sent for approval'); render(); },
  'sim-call': () => incomingCall(),
  'sim-overdue': () => { if (!active){ toast('Clock in first to try this', 'alert'); return; } active.visit.end = ago(20); tab = 'today'; render(); toast('Reminder: you’re past your scheduled end', 'phone'); },
  decline: () => { closeSheet(); toast('Your supervisor will be notified in 15 min', 'alert'); },
  answer: () => { closeSheet(); if (active){ tab = 'today'; render(); clockOutFlow(1); } else toast('No active visit'); },
  'req-off': el => reqOffSheet(el.dataset.date),
  'submit-off': () => {
    const from = $('#to-from').value, to = $('#to-to').value, all = $('#to-all').checked, type = $('#to-type').dataset.v;
    if (!from || !to || to < from){ toast('Check your dates', 'alert'); return; }
    if (from < iso(new Date())){ toast('Time off can’t start in the past', 'alert'); return; }
    if (!all && $('#to-e').value <= $('#to-s').value){ toast('End time must be after start time', 'alert'); return; }
    const r = {id:'TO-'+(110+timeOff.length), type, from, to, allDay:all, start:$('#to-s').value, end:$('#to-e').value, status:'Pending', note:$('#to-note').value.trim(), submitted:iso(new Date())};
    timeOff.push(r); calSel = from; calAnchor = pdate(from); closeSheet(); toast(`Request sent to ${me.sup.split(' ')[0]}`); render(); },
  'cancel-off': el => { const r = timeOff.find(x=>x.id===el.dataset.id); r.status = 'Cancelled'; closeSheet(); toast('Request cancelled'); render(); },
  rsvp: el => { rsvp[el.dataset.id] = el.dataset.v; toast(el.dataset.v==='yes' ? 'See you there!' : 'Thanks for letting us know'); itemSheet('e|'+el.dataset.id); render(); },
  ics: el => { const e = calEvents.find(x=>x.id===el.dataset.id), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([icsFor(e)], {type:'text/calendar'})); a.download = e.title.replace(/[^\w]+/g,'-').toLowerCase()+'.ics'; a.click(); toast('Calendar file downloaded'); },
  install: () => installApp(),
  'install-dismiss': () => { localStorageSet('al-install-dismissed', '1'); render(); },
  signout: () => { $('#layer').innerHTML = `<div class="call" style="justify-content:center;gap:24px"><div class="ring"><img src="brand_assets/logo.png" width="76" alt=""></div><h2 style="font-weight:400;font-size:28px;letter-spacing:-.04em;margin:0">Signed out</h2><button class="btn btn-sky" style="max-width:260px" data-act="signin">Sign in</button></div>`; },
  signin: () => closeSheet(),
};
function endVisit(noSig){
  const v = active.visit; v.aIn = active.start; v.aOut = new Date(); v.status = 'done'; v.method = active.method; v.tasks = window._log.tasks; active = null;
  closeSheet(); toast(noSig ? 'Clocked out · supervisor will follow up on signature' : 'Clocked out · service log submitted'); render();
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeSheet();
  const tb = e.target.closest('[data-tab]'); if (tb){ tab = tb.dataset.tab; openThread = null; render(); $('#screen').scrollTop = 0; return; }
  const th = e.target.closest('[data-thread]'); if (th){ openThread = th.dataset.thread; render(); return; }
  if (e.target.closest('[data-back]')){ openThread = null; render(); return; }
  const cn = e.target.closest('[data-cal-nav]'); if (cn){ const n = +cn.dataset.calNav; calAnchor = calView==='week' ? addDays(calAnchor, 7*n) : new Date(calAnchor.getFullYear(), calAnchor.getMonth()+n, 1, 12); calSel = calView==='week' ? iso(startOfWeek(calAnchor)) : iso(calAnchor); render(); return; }
  const cd = e.target.closest('[data-cal-day]'); if (cd){ calSel = cd.dataset.calDay; if (calView==='week'){ document.querySelectorAll('.wday').forEach(b => { const on = b.dataset.calDay===calSel; b.classList.toggle('sel', on); b.setAttribute('aria-selected', on); }); $('#d-'+calSel)?.scrollIntoView({behavior:'smooth', block:'start'}); } else render(); return; }
  const cv = e.target.closest('[data-cal-view]'); if (cv){ calView = cv.dataset.calView; calAnchor = pdate(calSel); render(); return; }
  if (e.target.closest('[data-cal-today]')){ calSel = iso(new Date()); calAnchor = new Date(); render(); if (calView==='week') $('#d-'+calSel)?.scrollIntoView({block:'start'}); return; }
  const ci = e.target.closest('[data-item]'); if (ci){ itemSheet(ci.dataset.item); return; }
  const tt = e.target.closest('[data-to-type]'); if (tt){ document.querySelectorAll('[data-to-type]').forEach(b => b.setAttribute('aria-pressed', b===tt)); $('#to-type').dataset.v = tt.dataset.toType; updateOffSummary(); return; }
  const a = e.target.closest('[data-act]'); if (a && acts[a.dataset.act]){ e.preventDefault(); acts[a.dataset.act](a); }
});
document.addEventListener('submit', e => { if (e.target.dataset.form === 'reply'){ e.preventDefault(); const t = msgs.find(m=>m.id===openThread); t.items.push({me:true, t:new Date(), body:$('#rp').value.trim()}); render(); $('#rp').focus(); } });
['input','change'].forEach(t => document.addEventListener(t, e => { if (e.target.closest('#to-form')) updateOffSummary(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer').innerHTML) closeSheet(); });
const setOnline = () => document.body.classList.toggle('is-offline', !navigator.onLine);
addEventListener('online', setOnline); addEventListener('offline', setOnline); setOnline();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
